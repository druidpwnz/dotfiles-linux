[general]
live_config_reload = true          # changes apply on save, no restart
import = ["~/.config/alacritty/themes/dracula.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 6 }
opacity = 0.98                     # needs a compositor (picom etc.) on X11
decorations = "Full"               # "None" if your WM handles borders
startup_mode = "Windowed"          # or "Maximized"
dynamic_title = true

[font]
size = 11.0
normal      = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold        = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic      = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[selection]
save_to_clipboard = true           # selecting text also copies it

[terminal]
# shell = { program = "/usr/bin/zsh", args = ["-l"] }

# [colors.primary]
# background = "#1d2021"
# foreground = "#d4be98"

[keyboard]
bindings = [
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Plus", mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },
]
