# Force a 256-sample quantum while REAPER or Hydrogen is connected as a JACK client.
# When they exit, the graph falls back to the default quantum.
jack.rules = [
    {   matches = [
            { application.process.binary = "reaper" }
            { application.process.binary = "hydrogen" }
        ]
        actions = {
            update-props = {
                node.force-quantum = 256
                node.force-rate    = 48000
            }
        }
    }
]
