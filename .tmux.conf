# True color in Alacritty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"

# Basics
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0          # no delay when pressing Esc in vim

# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix        # press Ctrl+a twice to send Ctrl+a to the program (e.g. start of line in bash)

# Move between panes with hjkl (arrows still work)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with HJKL (hold prefix, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys in copy mode and the command prompt
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

# Dracula options
set -g @dracula-plugins "time"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-time-format "%H:%M"

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
